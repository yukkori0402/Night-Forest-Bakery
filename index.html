<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜の森のパン屋</title>
<meta name="description" content="午前0時、森の奥にだけ現れるパン屋。静かなホラー要素のある、選択肢で進む物語。">
<meta property="og:title" content="夜の森のパン屋">
<meta property="og:description" content="午前0時、森の奥にだけ現れるパン屋。静かなホラー要素のある、選択肢で進む物語。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yukkori0402.github.io/Night-Forest-Bakery/">
<meta property="og:image" content="https://yukkori0402.github.io/Night-Forest-Bakery/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#f3e7cf; --bg2:#ecd9b8; --card:#fffaf0; --card2:#fff5e2;
    --ink:#4a3826; --ink2:#6d5840; --muted:#9a8563;
    --bread:#c98a4b; --bread2:#a5662a; --warm:#f0b45a; --warm2:#ffd98f;
    --line:#dfc9a0; --line2:#cbb27f;
    --danger:#b0532f; --night:#2e2a3a;
    --shadow:rgba(120,84,30,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    background:
      radial-gradient(900px 480px at 85% -10%, rgba(240,180,90,.35), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(201,138,75,.25), transparent 60%),
      linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
    line-height:1.9; letter-spacing:.02em;
    transition:background 1.2s ease;
  }
  body.late{
    background:
      radial-gradient(900px 480px at 85% -10%, rgba(84,74,120,.35), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(46,42,58,.4), transparent 60%),
      linear-gradient(180deg,#ddd0bd 0%,#c9b995 100%);
  }
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 56px;}
  header{text-align:center;padding:22px 8px 6px;}
  .moon{font-size:28px;}
  h1{margin:4px 0 2px;font-size:clamp(26px,6vw,38px);font-weight:600;color:var(--bread2);letter-spacing:.14em;text-shadow:0 2px 18px rgba(240,180,90,.45);}
  .subtitle{color:var(--ink2);font-size:14px;margin:0 0 4px;}
  .titlenote{color:var(--muted);font-size:12px;margin:0;min-height:1.4em;}
  .status{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:12px auto 4px;max-width:640px;}
  .chip{background:rgba(255,250,240,.92);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink);white-space:nowrap;}
  .chip b{color:var(--bread2);font-weight:600;}
  main.card{
    margin-top:18px;background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 44px var(--shadow), inset 0 0 0 5px rgba(223,201,160,.28);
    padding:26px 22px 24px;
  }
  .scene-img{font-size:44px;text-align:center;margin:2px auto 10px;width:96px;height:96px;line-height:96px;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, rgba(255,217,143,.85), rgba(240,180,90,.25) 55%, transparent 72%);
    box-shadow:0 0 34px rgba(240,180,90,.35);animation:glow 3.6s ease-in-out infinite;}
  @keyframes glow{0%,100%{box-shadow:0 0 26px rgba(240,180,90,.28);}50%{box-shadow:0 0 42px rgba(240,180,90,.48);}}
  .scene-text{font-size:clamp(16px,4.4vw,18px);white-space:pre-wrap;min-height:150px;}
  .scene-text .ch{opacity:0;animation:chin .28s ease forwards;}
  @keyframes chin{to{opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .scene-text .ch{opacity:1;animation:none;} .scene-img{animation:none;} .choices{animation:none;} }
  .choices{margin-top:22px;display:grid;gap:12px;}
  .choices.single{display:block;margin-top:12px;text-align:center;}
  button.continue{appearance:none;cursor:pointer;background:transparent;border:none;color:var(--muted);font:inherit;font-size:14px;letter-spacing:.18em;padding:10px 18px;}
  button.continue:hover,button.continue:active{color:var(--bread2);}
  button.choice, button.restart{
    appearance:none;width:100%;text-align:left;cursor:pointer;
    background:#fdf3dd;color:var(--ink);border:1px solid var(--line2);border-radius:14px;
    padding:15px 18px;font-size:16px;font-family:inherit;line-height:1.6;min-height:54px;
    transition:transform .08s ease, background .2s ease, border-color .2s ease;
  }
  button.choice:hover, button.choice:active{background:#fbe9c8;border-color:var(--bread);}
  button.choice:active{transform:scale(.99);}
  button.choice .arrow{color:var(--bread);margin-right:8px;}
  button.restart{text-align:center;background:var(--bread);color:#fff8ea;border-color:var(--bread);font-weight:700;}
  button.restart:hover{background:var(--bread2);}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;}
  button.tool{
    appearance:none;cursor:pointer;background:rgba(255,250,240,.9);color:var(--ink2);
    border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-family:inherit;
  }
  button.tool.on{background:var(--bread);color:#fff8ea;border-color:var(--bread);}
  .ending-badge{display:inline-block;border:1px solid var(--bread);color:var(--bread2);border-radius:999px;padding:4px 14px;font-size:13px;letter-spacing:.14em;margin-bottom:12px;}
  .ending-badge.horror{border-color:var(--danger);color:var(--danger);}
  .ending-title{font-size:clamp(22px,5.6vw,30px);margin:0 0 14px;color:var(--bread2);}
  .ending-badge.horror + .ending-title{color:var(--danger);}
  .note{margin-top:16px;font-size:13px;color:var(--muted);text-align:center;}
  input.namein{
    width:100%;padding:14px 16px;font-size:17px;font-family:inherit;color:var(--ink);
    background:#fffdf6;border:1px solid var(--line2);border-radius:12px;margin:6px 0 4px;
  }
  .overlay{
    position:fixed;inset:0;background:rgba(58,42,20,.45);display:none;z-index:40;
    align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;
  }
  .overlay.open{display:flex;}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;padding:22px 20px;box-shadow:0 24px 60px rgba(60,40,10,.35);}
  .sheet h2{margin:0 0 10px;font-size:20px;color:var(--bread2);}
  .sheet .entry{border-top:1px dashed var(--line);padding:10px 2px;font-size:15px;white-space:pre-wrap;}
  .sheet .entry:first-of-type{border-top:none;}
  .sheet .empty{color:var(--muted);font-size:14px;}
  .coll-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px dashed var(--line);padding:10px 2px;}
  .coll-item .t{font-size:16px;}
  .coll-item .s{font-size:12px;color:var(--muted);}
  .coll-btns{display:contents;}
  .fade{animation:fade .55s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .choices{animation:fade .6s .3s ease both;}
  .choices .choice{animation:fade .5s ease both;}
  .choices .choice:nth-child(2){animation-delay:.08s;}
  .choices .choice:nth-child(3){animation-delay:.16s;}
  .choices .choice:nth-child(4){animation-delay:.24s;}
  .choices .choice:nth-child(5){animation-delay:.32s;}
  button.choice:hover{box-shadow:inset 3px 0 0 var(--bread);}
  button.choice.seen{opacity:.55;}
  button.continue.seen{opacity:.55;}
  button.continue .seen-tag{float:none;margin-left:10px;}
  .seen-tag{float:right;font-size:11px;color:var(--muted);letter-spacing:.08em;padding-top:4px;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(58,38,14,.20) 100%);}
  body.late::after{background:radial-gradient(120% 90% at 50% 40%, transparent 48%, rgba(20,16,34,.40) 100%);}
  @media (max-width:480px){ main.card{padding:22px 16px;} .scene-text{min-height:140px;} .coll-item{flex-direction:column;align-items:stretch;} .coll-btns{display:flex;gap:8px;} .coll-btns button.tool{flex:1;white-space:nowrap;} }
</style>
</head>

<script>
"use strict";
/* ================================================================
   夜の森のパン屋 v2（核スライス・書き直し版）
   保存キー: nfb_v2_meta（周回をまたぐ）/ nfb_v2_run（周回内）
   ================================================================ */
var META_KEY = "nfb_v2_meta";
var RUN_KEY  = "nfb_v2_run";

function loadJSON(key, fallback){
  try{ var raw = localStorage.getItem(key); if(!raw) return fallback; var v = JSON.parse(raw); return (v===null||v===undefined)?fallback:v; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function newMeta(){
  return {
    name: "", reason: "",
    loops: 0,               // 完了した周回数
    endings: {},            // 到達したエンディング
    endingCounts: {}, lastEndingId: "", pendingNudge: "", nudgesShown: {}, shioriOpen: {},
    notes: [],              // 手帳メモ [{id,text}]
    read: {},               // 既読シーン {id:true}
    readSig: {},            // 既読シーンの本文の指紋 {id:hash}
    slips: 0,               // 記録した店主の綻びの数
    quietVoiceless: false,  // 静かな客が声を失った（次周から筆談）
    photos: [],             // 撮った写真の id（周回をまたぐ）
    reviewedPhotos: [],     // 見返し済みの写真 id
    truthForest: false, truthShop: false, truthSelf: false,
    expScatter: false, expNoScatter: false,
    expCaught: false, forestKnown: false,
    expPhoto: false,
    recordsDeep: 0, bgmOff: false,
    doorHint: false,       // 扉の手がかりを一度見つけた（周回をまたいで残る）
    newGuestFate: "",
    bringUnlocked: false,
    finalArmed: false,
    skip: false,
    metTalk: false, metQuiet: false, talkedQuiet: false
  };
}
function newRun(){
  return {
    scene: "", phase: 0, hunger: 0,
    breads: [],            // 所持パン id 配列
    tasted: false,         // 試食を食べた
    askedWay: false,       // 店主に帰り道を聞いた
    boughtBread: "",       // 買ったパン
    paidPrice: "",         // 表の対価
    metTalkRun: false,     // この周で常連客と話した
    talkShop: false, talkPrice: false, talkWay: false,
    shopPrice2: false, shopGuests: false, shopStay: false, waited: false,
    quietPrice: false, quietWay: false, quietVoice: false, quietMetRun: false,
    sharedWake: false,     // 分け合うパンを静かな客と分けた
    heardKuro: false,      // 黒いパンについて聞いた
    wakeHalf: false,       // 分け合うパンが半分になっている
    looked: false,         // 外出で明かりを確かめた
    forkChoice: "",        // 初回の外出で選んだ道
    deepWent: false,       // 初回の外出で奥まで進んだ
    peeked: false,         // 冊子を覗いた
    noticedMaybe: false,   // 店主が気づいたかもしれない余韻
    scattered: false,      // 終盤、欠片を落としながら出た
    markedTrail: false,   // 外出で、戻るための目印の欠片を落としながら進んだ
    callItem: "",          // 呼びかけの「忘れ物」への対応 took/denied/shown
    _pendingEat: "", _eatReturn: "",
    bring: "", bringEaten: false, bringShared: false, smellDone: false,
    trustShop: 2, trustTalk: 2, trustQuiet: 2, liedShop: false,
    metChild: false, metPair: false, metName: false, metNew: false, metFormer: false,
    phoneDone: false, talkClock: 0, guestsGone: false,
    explored: 0, recordsRead: false, roomEntered: false, caught: false, recordsVisits: 0, kitchenVisits: 0, leftVisits: 0, umbrellaVisits: 0, diaryVisits: 0, roomVisits: 0, hideSpot: "", ownPriceWorry: false, ownPriceAsked: false, noteChecked: false, tookPhotos: [], photoAlienShown: false,
    kuroBought: false, paidName: false, kuroAte: false,
    gaveMorning: false,
    final: false, finalBroken: false, finalSawBuyback: false,
    reread: false,
    endedId: ""
  };
}
var M = loadJSON(META_KEY, null); if(!M || typeof M !== "object") M = newMeta();
var R = loadJSON(RUN_KEY, null);  if(!R || typeof R !== "object") R = newRun();
/* 旧セーブとの互換：欠けている項目を補う */
(function(){
  var dm = newMeta(); for(var k in dm){ if(M[k]===undefined) M[k]=dm[k]; }
  var dr = newRun();  for(var k2 in dr){ if(R[k2]===undefined) R[k2]=dr[k2]; }
  M.slips = Math.max(M.slips||0, M.notes.filter(function(n){ return n.id.indexOf("slip")>=0; }).length);
  if((M.recordsDeep||0) >= 1) M.doorHint = true; /* 部屋に入ったことがある旧セーブは、扉の手がかりを見つけたものとして扱う */
  /* 声の喪失は、実際に話題を聞いた会話があった場合だけ。会話の記録（手帳メモ）が無いのに筆談化していた旧セーブは戻す */
  if(M.quietVoiceless && !M.talkedQuiet){
    var hasQuietNote = false;
    for(var n3=0;n3<M.notes.length;n3++){ if(M.notes[n3].id==="quiet_price" || M.notes[n3].id==="quiet_way") hasQuietNote = true; }
    if(hasQuietNote){ M.talkedQuiet = true; } else { M.quietVoiceless = false; }
  }
})();

var PHASES = ["午前0時すぎ","午前1時","午前2時","午前3時","午前4時","夜明け前"];
var BREAD_NAMES = { marui:"丸いパン", oto:"音のしないパン", kinou:"昨日のパン", wake:"分け合うパン", nioi:"匂いのないパン", omosa:"重さの変わるパン", kuro:"黒いパン" };

function saveAll(){ saveJSON(META_KEY, M); saveJSON(RUN_KEY, R); }
function hasBread(id){ return R.breads.indexOf(id) >= 0; }
function giveBread(id){ if(!hasBread(id)) R.breads.push(id); }
function takeBread(id){ var i = R.breads.indexOf(id); if(i>=0) R.breads.splice(i,1); }
var SCATTERABLE = ["marui","oto","wake","omosa"];  // くずの材料にできるパン（黒いパンは不可）
function hasScatterable(){ return SCATTERABLE.some(function(id){ return hasBread(id); }); }
function takeScatterable(){ for(var i=0;i<SCATTERABLE.length;i++){ if(hasBread(SCATTERABLE[i])){ takeBread(SCATTERABLE[i]); return; } } }
function hasEdible(){ return ["marui","oto","kinou","wake","nioi","omosa"].some(function(id){ return hasBread(id); }); }

function addNote(id, text){
  if(!Array.isArray(M.notes)) M.notes = [];
  for(var i=0;i<M.notes.length;i++){ if(M.notes[i].id===id) return; }
  M.notes.push({id:id, text:text});
  if(id.indexOf("slip")>=0) M.slips = Math.max(M.slips||0, M.notes.filter(function(n){ return n.id.indexOf("slip")>=0; }).length);
}
function bumpHunger(n){ R.hunger = Math.max(0, Math.min(3, R.hunger + n)); }
function hungerWord(){
  if(R.hunger>=3) return "お腹が空いて、立っているのがやっとだった。";
  if(R.hunger==2) return "お腹が空いていた。集中が続かない。";
  if(R.hunger==1) return "少し、お腹が空いてきた。";
  return "";
}
function pname(){ return M.name ? M.name : "わたし"; }
function loopN(){ return M.loops + 1; }
function isRain(){ return M.loops % 3 === 2; }
function bumpTalk(){
  R.talkClock = (R.talkClock || 0) + 1;
  if(R.talkClock >= 3) R.phase = Math.max(R.phase, 2);
  if(R.talkClock >= 6){ R.phase = Math.max(R.phase, 3); R.guestsGone = true; }
  saveAll();
}
function guestGone(kind){
  if(!R.guestsGone) return false;
  if(kind === "talk") return !!R.talkWay;
  if(kind === "quiet") return !!R.quietWay;
  return true;
}
function guestName(){ var ns = ["あきら","さくら","れん","ゆず"]; return ns[M.loops % 4]; }
function prevGuestName(){ var ns = ["あきら","さくら","れん","ゆず"]; return ns[(M.loops + 3) % 4]; }
function hasPhoto(id){ return M.photos.indexOf(id) >= 0; }
function takePhoto(id){ if(!hasPhoto(id)) M.photos.push(id); if(R.tookPhotos && R.tookPhotos.indexOf(id) < 0) R.tookPhotos.push(id); }
function finalReady(){ return M.truthForest && M.truthShop && M.truthSelf && M.slips >= 3 && M.expScatter && M.expNoScatter && (M.expCaught || M.expPhoto); }
function smellPending(){ return R.bring==="onigiri" && !R.bringEaten && !R.bringShared && !R.smellDone && !hasBread("nioi"); }

function setStatusVisible(v){
  statusEl.style.display = v ? "flex" : "none";

function refreshStatus(){
  timeEl.textContent = PHASES[Math.min(R.phase, PHASES.length-1)];
  var names = R.breads.map(function(b){
    var n = BREAD_NAMES[b] || b;

  });

}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function textSig(t){
  var h = 5381, str = String(t);
  for(var i=0;i<str.length;i++){ h = (((h*33) ^ str.charCodeAt(i)) >>> 0); }
  return h;
}
function sigText(t){
  var str = String(t);
  var words = ["お腹が空いて、立っているのがやっとだった。", "お腹が空いていた。集中が続かない。", "少し、お腹が空いてきた。"];
  for(var i=0;i<words.length;i++){ str = str.split(words[i]).join(""); }
  return str.replace(/\n{3,}/g, "\n\n").replace(/\s+$/, "");
}
function previewText(sc){
  if(typeof sc.text === "string") return sc.text;
  var snapM = JSON.stringify(M), snapR = JSON.stringify(R), t = null;
  try { t = sc.text(); } catch(e){ t = null; }
  try { M = JSON.parse(snapM); R = JSON.parse(snapR); saveAll(); } catch(e2){}
  return t;
}
function richText(t){
  var str = String(t), out = "", d = 0;
  for(var i=0;i<str.length;i++){
    var c = str[i];
    if(c === "\n"){ out += "\n"; continue; }
    var e = (c==="&") ? "&amp;" : (c==="<") ? "&lt;" : (c===">") ? "&gt;" : c;
    out += '<span class="ch" style="animation-delay:' + Math.min(d, 2100) + 'ms">' + e + '</span>';
    d += 13;
  }
  return out;
}

function clearTimers(){ navToken++; if(skipTimer){ clearTimeout(skipTimer); skipTimer = null; } }

function go(id){ clearTimers(); R.scene = id; saveAll(); render(); }

function render(){
  var sc = SCENES[R.scene];
  if(!sc){ showTitle(); return; }
  var wasRead = !!M.read[R.scene];
  if(sc.onEnter) sc.onEnter();
  var text = (typeof sc.text === "function") ? sc.text() : sc.text;
  var sigSetBefore = (M.readSig && M.readSig[R.scene]) || null;
  if(typeof sigSetBefore === "number") sigSetBefore = [sigSetBefore];
  var seenBefore = !!(wasRead && sigSetBefore && (sigSetBefore.indexOf(textSig(text)) >= 0 || sigSetBefore.indexOf(textSig(sigText(text))) >= 0));
  imgEl.textContent = sc.img || "🥐";
  var html = "";
  if(sc.badge) html += '<span class="ending-badge' + (sc.horror ? " horror" : "") + '">' + esc(sc.badge) + '</span>';
  if(sc.title) html += '<h2 class="ending-title">' + esc(sc.title) + '</h2>';
  html += '<div class="scene-text">' + richText(text) + '</div>';
  contentEl.innerHTML = html;
  cardEl.classList.remove("fade"); void cardEl.offsetWidth; cardEl.classList.add("fade");
  choicesEl.innerHTML = "";
  setStatusVisible(true);
  refreshStatus();
  var list = (sc.choices || []).filter(function(c){ return !c.if || c.if(); });
  choicesEl.classList.toggle("single", list.length === 1);
  list.forEach(function(c){
    var b = document.createElement("button");
    b.type = "button";
    var seenSame = false;
    if(c.to){
      var destId = null, pvText = null;
      var snapM2 = JSON.stringify(M), snapR2 = JSON.stringify(R);
      try {
        if(c.do) c.do();
        var toId = (typeof c.to === "function") ? c.to() : c.to;
        if(toId && SCENES[toId]){
          destId = toId;
          R.scene = toId;
          var dsc2 = SCENES[toId];
          if(dsc2.onEnter) dsc2.onEnter();
          pvText = (typeof dsc2.text === "function") ? dsc2.text() : dsc2.text;
        }
      } catch(e){ destId = null; pvText = null; }
      try { M = JSON.parse(snapM2); R = JSON.parse(snapR2); saveAll(); } catch(e2){}
      if(destId && M.read[destId]){
        var sig = (M.readSig || {})[destId];
        var sigSet = (typeof sig === "number") ? [sig] : (Array.isArray(sig) ? sig : null);
        if(sigSet){
          if(pvText !== null && (sigSet.indexOf(textSig(pvText)) >= 0 || sigSet.indexOf(textSig(sigText(pvText))) >= 0)) seenSame = true;
        }
      }
    }
    if(list.length === 1){
      var contLabel = c.t;
      b.className = "continue" + (seenSame ? " seen" : "");
      b.innerHTML = esc(contLabel) + (seenSame ? '<span class="seen-tag">前に読んだ</span>' : '');
      b.setAttribute("aria-label", contLabel);
    } else {
      b.className = "choice" + (seenSame ? " seen" : "");
      b.innerHTML = '<span class="arrow">▸</span>' + esc(c.t) + (seenSame ? '<span class="seen-tag">前に読んだ</span>' : '');
    }
    b.addEventListener("click", function(){
      clearTimers();
      if(c.do) c.do();
      var to = (typeof c.to === "function") ? c.to() : c.to;
      if(to) go(to); else saveAll();
    });
    choicesEl.appendChild(b);
  });
  M.read[R.scene] = true;
  if(!M.readSig) M.readSig = {};
  var sigArr = M.readSig[R.scene];
  if(typeof sigArr === "number") sigArr = [sigArr];
  if(!Array.isArray(sigArr)) sigArr = [];
  var sgRaw = textSig(text), sgNorm = textSig(sigText(text));
  if(sigArr.indexOf(sgRaw) < 0) sigArr.push(sgRaw);
  if(sigArr.indexOf(sgNorm) < 0) sigArr.push(sgNorm);
  if(sigArr.length > 24) sigArr = sigArr.slice(sigArr.length - 24);
  M.readSig[R.scene] = sigArr;
  saveAll();
  if(R.scene === "end_screen" && !R.reread && R.endedId){
    var shareBtn = document.createElement("button");
    shareBtn.type = "button"; shareBtn.className = "choice";
    shareBtn.innerHTML = '<span class="arrow">▸</span>Xで共有する';
    shareBtn.addEventListener("click", function(){ shareEnding(); });
    choicesEl.appendChild(shareBtn);
  }
  /* 見えない制限時間（最終局面専用）：時間切れで自動的に進む */
  if(sc.timeout && !R.reread){
    var tkT = navToken; var destT = sc.timeout.to; var msecT = sc.timeout.sec * 1000; var curT = R.scene;
    setTimeout(function(){ if(tkT===navToken && R.scene===curT) go(destT); }, msecT);
    if(sc.timeout.stages){
      sc.timeout.stages.forEach(function(st){
        setTimeout(function(){
          if(tkT===navToken && R.scene===curT){
            var p = document.createElement("p");
            p.textContent = st.text;
            var stHost = contentEl.querySelector(".scene-text");
            if(stHost) stHost.appendChild(p); else contentEl.appendChild(p);
          }
        }, st.sec * 1000);
      });
    }
  }
  /* 既読スキップ：本文が前回と本当に同じ単一選択シーンだけを自動で送る（選択肢の前では必ず止まる） */
  if(M.skip && seenBefore && list.length === 1){
    var btn = choicesEl.querySelector("button");
    if(btn){
      var tk = navToken;
      skipTimer = setTimeout(function(){ if(tk===navToken && btn.isConnected) btn.click(); }, 650);
    }
  }
}

function openNotebook(){
  var html = "<h2>手帳</h2>";
  html += '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">店で見聞きしたことが、そのまま書き留めてある。</div>';
  if(!M.notes.length) html += '<div class="empty">まだ何も書かれていない。</div>';
  var nudgeNotes = M.notes.filter(function(n){ return n.id.indexOf("nudge_") === 0; });
  var slipNotes = M.notes.filter(function(n){ return n.id.indexOf("nudge_") !== 0 && n.id.indexOf("slip") >= 0; });
  var restNotes = M.notes.filter(function(n){ return n.id.indexOf("nudge_") !== 0 && n.id.indexOf("slip") < 0; });
  function noteSection(title, arr){
    if(!arr.length) return "";
    var h = '<div style="margin:14px 0 4px;font-weight:bold">' + title + '</div>';
    arr.forEach(function(n){ h += '<div class="entry">' + esc(n.text) + '</div>'; });
    return h;
  }
  html += noteSection("―― 気づき", nudgeNotes);
  html += noteSection("―― 店主の言い直し", slipNotes);
  html += noteSection("―― メモ", restNotes);
  html += '<div style="margin:14px 0 4px;font-weight:bold">―― まだ見ていない夜</div>';
  var unreached = ENDING_DEFS.filter(function(e){ return !M.endings[e.id]; });
  if(!unreached.length) html += '<div class="entry">見ていない夜は、もう残っていない。</div>';
  var anyTwice = false;
  for(var ek in (M.endingCounts || {})){ if(M.endingCounts[ek] >= 2) anyTwice = true; }
  unreached.forEach(function(e, i){
    var num = ("0" + (i + 1)).slice(-2);
    var opened = (M.shioriOpen || {})[e.id] || 1;
    html += '<div class="entry"><div>夜のしおり ' + num + '</div>';
    html += '<div>' + esc(e.hint) + '</div>';
    var minNight = HINT_MIN_NIGHT[e.id];
    if(minNight && loopN() < minNight) html += '<div style="font-size:13px;color:var(--muted)">この道は' + (minNight === 3 ? "三" : "二") + '夜目から</div>';
    if(opened >= 2) html += '<div>' + esc(HINT_STAGE2[e.id]) + '</div>';
    else if(M.loops >= 1) html += '<div><button class="tool" onclick="openShiori(\'' + e.id + '\',2)">もう少し読む</button></div>';
    if(opened >= 3) html += '<div>' + esc(HINT_STAGE3[e.id]) + '</div>';
    else if(anyTwice) html += '<div><button class="tool" onclick="openShiori(\'' + e.id + '\',3)">道をたしかめる</button></div>';
    html += '</div>';
  });
  html += '<div style="margin-top:14px"><button class="tool" onclick="closeOverlay()">閉じる</button> ';
  html += '<button class="tool" onclick="renamePrompt()">名前を変更する</button></div>';
  sheetEl.innerHTML = html;
  overlayEl.classList.add("open");
}

var TRUTH_RECORD = "この店は、客がいて、やり取りが続いている間だけ、ここにある。誰も客にならなければ、店は朝まで保たない。私がそれを知ったのは、ずっと後のことだった。\n\n最初にこの森に呼ばれたのは、私だった。私は店を開き、最初の客に店を売った。売る時、店の記憶をここへ置いていった。だから私は、何も知らない客として、またこの森に呼ばれる。\n\n今の店主は、あの最初の客だ。今の店主の側からは、買い戻してほしいとは言い出せない。だから言い直しをしながら、私が言い出すのを待っている。買い戻せば、私がまた店主になる。それは、助けではない。\n\n助けは、別の所にある。その夜、誰も客にならないこと。食べず、買わず、声に答えず、やり取りのない夜を。";

/* エンディング到達処理 */
function pickNudge(){
  var cand = [];
  if(!M.truthSelf && (M.recordsDeep||0) < 1) cand.push(["nudge_room", "奥の方は、まだ何も知らない。"]);
  if(!M.truthForest) cand.push(["nudge_forest", "森のことは、まだ聞いていない。"]);
  if(!M.truthShop) cand.push(["nudge_shop", "この店のことは、まだ聞いていない。"]);
  if(!M.expScatter) cand.push(["nudge_scatter", "パンくずは、まだ撒いたことがない。"]);
  else if(!M.expNoScatter) cand.push(["nudge_noscatter", "撒かずに帰る夜は、まだない。"]);
  if(!M.expPhoto && !M.expCaught) cand.push(["nudge_photo", "写真の中のことは、まだ確かめていない。"]);
  if(M.slips < 3) cand.push(["nudge_slips", "店主の言い直しには、まだ続きがある気がする。"]);
  for(var i=0;i<cand.length;i++){ if(!M.nudgesShown[cand[i][0]]) return cand[i]; }
  return null;
}
function reachEnding(id){
M.endings[id] = true;
R.endedId = id;
/* 静かな客は、この夜のどこかで声を払う（次周から筆談） */
if(M.metQuiet && (M.talkedQuiet || R.quietPrice || R.quietWay || R.quietVoice)) M.quietVoiceless = true;
M.bringUnlocked = true;
if(!M.endingCounts) M.endingCounts = {};
if(!M.nudgesShown) M.nudgesShown = {};
var consecutiveEnd = (M.lastEndingId === id);
M.endingCounts[id] = (M.endingCounts[id] || 0) + 1;
M.lastEndingId = id;
if(id !== "trueend" && !M.pendingNudge){
  var pick = null;
  if(finalReady() && !M.nudgesShown["nudge_final"]) pick = ["nudge_final", "手帳のメモが、みんな同じ方を向いてきた。次の夜は、今までと違う夜になる。"];
  else if(M.loops >= 1 || consecutiveEnd || M.endingCounts[id] >= 3) pick = pickNudge();
  if(pick){
    M.nudgesShown[pick[0]] = true;
    M.pendingNudge = pick[1];
    addNote(pick[0], pick[1]);
  }
}
saveAll();
}
function finishRun(){
if(R.reread){ showTitle(); return;}
M.loops += 1;
if(finalReady()) M.finalArmed = true;
saveAll();
R = newRun(); saveAll();
showTitle();
}

/* ============ 起動 ============ */
showTitle();
